````yml
name: Progress Additions Notify

on:
  push:
    paths:
      - "docs/progress.md"
      - ".github/workflows/readme-diff-notify.yml"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get progress additions
        shell: bash
        run: |
          git diff --unified=0 HEAD~1 HEAD -- docs/progress.md > progress.diff || true

          grep '^+' progress.diff \
            | grep -v '^+++' \
            | sed 's/^+//' \
            > progress-additions.md || true

          if [ ! -s progress-additions.md ]; then
            echo "docs/progress.md was changed, but no added lines were detected." > progress-additions.md
          fi

          head -c 1400 progress-additions.md > progress-short.md

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]

          with open("progress-short.md", "r", encoding="utf-8", errors="replace") as f:
              progress_text = f.read()

          repo = os.environ.get("REPO", "")
          actor = os.environ.get("ACTOR", "")
          commit_message = os.environ.get("COMMIT_MESSAGE", "")
          commit_url = os.environ.get("COMMIT_URL", "")

          content = (
              "進捗ログが更新されました。\n\n"
              f"Repository: {repo}\n"
              f"Author: {actor}\n"
              f"Commit: {commit_message}\n"
              f"{commit_url}\n\n"
              "追加された内容:\n"
              "```md\n"
              f"{progress_text}\n"
              "```"
          )

          if len(content) > 1900:
              content = content[:1850] + "\n...\n```"

          payload = json.dumps({"content": content}).encode("utf-8")

          request = urllib.request.Request(
              webhook_url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Progress-Notifier",
              },
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY
````
